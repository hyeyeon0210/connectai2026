<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI EDA 프로젝트 플랫폼</title>

<style>

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#f4f7fb;
}

header{
    background:#123b66;
    color:#fff;
    height:64px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
}

.layout{
    display:grid;
    grid-template-columns:240px 1fr 300px;
    height:calc(100vh - 64px);
}

.sidebar{
    background:#1f2937;
    color:#fff;
    padding:12px;
}

.sidebar div{
    padding:10px;
    border-radius:8px;
    margin:4px 0;
}

.sidebar div:hover{
    background:#374151;
}

.main{
    padding:16px;
    overflow:auto;
}

.right{
    background:#fff;
    border-left:1px solid #ddd;
    padding:16px;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
    box-shadow:0 1px 4px rgba(0,0,0,.1);
}

.progress{
    height:20px;
    background:#ddd;
    border-radius:30px;
}

.bar{
    height:20px;
    width:43%;
    background:#22c55e;
    border-radius:30px;
}

iframe{
    width:100%;
    height:700px;
    border:none;
    border-radius:8px;
}

.hidden{
    display:none;
}

button{
    padding:8px 12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#2563eb;
    color:white;
}

</style>

</head>

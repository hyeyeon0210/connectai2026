<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI EDA 프로젝트 플랫폼</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#f4f7fb;
}

header{
    height:64px;
    background:#123b66;
    color:white;
    display:flex;
    align-items:center;
    padding:0 24px;
}

header h2{
    margin:0;
    font-size:22px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    border-radius:12px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.progress{
    height:16px;
    background:#e5e7eb;
    border-radius:999px;
    overflow:hidden;
}

.bar{
    width:15%;
    height:100%;
    background:#22c55e;
}

.workspace{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:16px;
}

.note-panel textarea{
    width:100%;
    height:70px;
    resize:none;
    margin-bottom:10px;
    border:1px solid #ddd;
    border-radius:8px;
    padding:8px;
}

iframe{
    width:100%;
    height:760px;
    border:none;
    border-radius:10px;
}

.hidden{
    display:none;
}

.badge{
    display:inline-block;
    background:#dbeafe;
    color:#1d4ed8;
    padding:6px 12px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    margin-bottom:10px;
}
